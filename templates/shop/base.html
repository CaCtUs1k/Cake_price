<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магазин Тортів</title>
    <!-- Підключаємо Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Навігаційна панель -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'shop:catalog' %}">CakeShop</a>
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'shop:rules' %}">Правила замовлення</a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Основний контент (займає весь вільний простір) -->
    <div class="container flex-grow-1">
        {% block content %}
        {% endblock %}
    </div>

    <!-- Футер сайту -->
    <footer class="bg-white text-center text-muted py-4 mt-5 border-top shadow-sm">
        <div class="container">
            <small>
                Усі фото оброблені штучним інтелектом для більш показового зовнішнього вигляду,
                але всі пропорції збережені в реальному співвідношенні❤️.
            </small>
        </div>
    </footer>

</body>
</html>
